name: API CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: bodrum_aktivite
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: localpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d bodrum_aktivite"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3001
      APP_URL: http://localhost:3000
      API_URL: http://localhost:3001
      SWAGGER_ENABLED: false
      TYPEORM_ENABLED: true
      BULLMQ_ENABLED: false
      JWT_SECRET: change-me
      JWT_REFRESH_SECRET: change-me
      DATABASE_URL: postgresql://admin:localpass@localhost:5432/bodrum_aktivite
      REDIS_URL: redis://localhost:6379
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: aktivite-files

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run DB migrations
        run: npm --workspace apps/api run migration:run

      - name: Build
        run: npm --workspace apps/api run build

      - name: Unit tests
        run: npm --workspace apps/api run test -- --runInBand

      - name: E2E tests
        run: npm --workspace apps/api run test:e2e -- --runInBand

